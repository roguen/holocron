# Holocron CI
#
# This runs on Linux on purpose, and it is worth understanding why before
# trimming it. Work happens on the Windows target, whose filesystem is
# case-insensitive (core.ignorecase=true). Three whole classes of bug are
# therefore INVISIBLE on the machine where the work happens, and this Linux job
# is the only thing in the project that can see them:
#
#   * a header included as "AudioFrame.hpp" but named audio_frame.hpp
#   * two tracked paths differing only in case, which cannot coexist on Windows
#   * .gitattributes patterns that silently fail to match, since attribute
#     matching is case-sensitive only when core.ignorecase is false
#
# None of these produce a local error. The hygiene job is the only thing that
# catches them, which is why it existed before there was any build system.
#
# The build job below now covers BOTH platforms. That matters: until M1 there
# was no job that built for the deployment target at all, which meant CI tested
# the canary and nothing tested what ships.

name: CI

on:
  push:
    branches: [main]
    # Tags are built so the version check can compare the tree against the tag
    # itself (issue #38). Without this the tag half of that check is dead code:
    # tagging happens after the merge, so the push-to-main run has already
    # finished by the time the tag exists.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract headers compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glm (required by track_context.hpp)
        run: sudo apt-get update && sudo apt-get install -y libglm-dev

      # Headers are checked via a TU that INCLUDES them, not by compiling the
      # header directly: GCC rejects `#pragma once in main file` under -Werror,
      # and compiling a header as the main file is not what we want to prove
      # anyway. Including it twice additionally verifies the include guard.
      #
      # audio_frame.hpp is deliberately std-only, so it must compile with no
      # third-party include path at all. If that ever stops being true, the
      # contract has grown a dependency it was designed not to have.
      - name: audio_frame.hpp is self-contained and dependency-free
        run: |
          printf '#include "holocron/audio_frame.hpp"\n#include "holocron/audio_frame.hpp"\n' > /tmp/tu_audio.cpp
          for cxx in g++ clang++; do
            echo "--- $cxx ---"
            $cxx -std=c++20 -Wall -Wextra -Werror -fsyntax-only -Iinclude /tmp/tu_audio.cpp
          done

      - name: track_context.hpp is self-contained against glm
        run: |
          printf '#include "holocron/track_context.hpp"\n#include "holocron/track_context.hpp"\n' > /tmp/tu_track.cpp
          for cxx in g++ clang++; do
            echo "--- $cxx ---"
            $cxx -std=c++20 -Wall -Wextra -Werror -fsyntax-only -Iinclude /tmp/tu_track.cpp
          done

      # The static_asserts guarantee AudioFrame can cross the analysis/render
      # thread boundary by memcpy. Assert the size too, so an accidental field
      # addition shows up as a deliberate decision rather than a silent change.
      # THE M3 CRITERION, CHECKED BY A COMPILER RATHER THAN ASSERTED.
      #
      # "The facet interface is expressible across a C ABI boundary" is worth
      # nothing as a claim in a document. A C compiler accepting the header is
      # the claim: no references, no templates, no std::, no default arguments,
      # nothing that needs a C++ ABI to describe.
      #
      # Compiled as C AND as C++, because the header is included from both sides
      # and `extern "C"` has to be right in each. -Wpedantic catches the things
      # that quietly work on one compiler, which is the same reason this job
      # exists at all.
      - name: facet_abi.h is valid C and valid C++
        run: |
          printf '#include "holocron/facet_abi.h"\n#include "holocron/facet_abi.h"\nint main(void){return 0;}\n' > /tmp/tu_abi.c
          for cc in gcc clang; do
            echo "--- $cc (C11) ---"
            $cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude /tmp/tu_abi.c -o /tmp/tu_abi
          done
          printf '#include "holocron/facet_abi.h"\n#include "holocron/facet_abi.h"\n' > /tmp/tu_abi.cpp
          for cxx in g++ clang++; do
            echo "--- $cxx (C++20) ---"
            $cxx -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Iinclude /tmp/tu_abi.cpp
          done

      - name: AudioFrame invariants hold
        run: |
          cat > /tmp/check.cpp <<'EOF'
          #include "holocron/audio_frame.hpp"
          #include <cstdio>
          using namespace holocron;
          static_assert(std::is_trivially_copyable_v<AudioFrame>);
          static_assert(std::is_standard_layout_v<AudioFrame>);
          int main() {
              std::printf("sizeof(AudioFrame) = %zu\n", sizeof(AudioFrame));
              return sizeof(AudioFrame) == 10768 ? 0 : 1;
          }
          EOF
          g++ -std=c++20 -Iinclude /tmp/check.cpp -o /tmp/check
          /tmp/check || { echo "::error::AudioFrame layout changed — update the expected size if intentional"; exit 1; }

  # ---------------------------------------------------------------------------
  # M8. The Android branches of the platform layer get a compiler.
  #
  # `render_text`, `https_client` and the JNI helper each carry an
  # `#elif defined(__ANDROID__)` block, and nothing in this project builds for
  # Android. Without this job those blocks would be code no compiler ever reads —
  # which is the thing the project has a rule against, written on
  # `--no-compositor` and again on the DSA port: a path nothing can reach on
  # purpose is a path nobody finds out is broken.
  #
  # It is free. GitHub's ubuntu runners ship an NDK and set
  # ANDROID_NDK_LATEST_HOME, so there is no download step and no setup action.
  #
  # WHAT IT DOES NOT PROVE is written into the script's own output and is worth
  # repeating here: it compiles, it does not link, it does not package, and
  # nothing has ever run on the device. With no arm64-android dependency tree on
  # the runner most translation units are SKIPPED, and the script prints which —
  # a check that silently covers three files out of twenty reads exactly like a
  # check that covers twenty.
  # ---------------------------------------------------------------------------
  android:
    name: Android platform layer compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The NDK the runner already has
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_NDK_LATEST_HOME" || { echo "::error::no NDK on this runner"; exit 1; }

      # The files carrying an __ANDROID__ branch need headers, and the script
      # fails deliberately when one of them is SKIPPED for a missing dependency
      # — so they have to be here or this job cannot do its job.
      #
      # text_render.cpp reaches glm through palette.hpp; window.cpp needs SDL3.
      #
      # THROUGH VCPKG FOR THE arm64-android TRIPLET, not through apt. Two
      # reasons. Ubuntu has no SDL3 package at all, so apt could not supply it
      # anyway. And the host packages are the wrong content in a way that is
      # easy to miss: putting `-isystem /usr/include` on a cross-compile line
      # searches glibc's headers ahead of the NDK's sysroot, which produces
      # failures that look like Android bugs and are not.
      #
      # Header-only ports (glm) cost seconds. SDL3 is a real build and is the
      # bulk of this job's time; it is cached by vcpkg's own binary cache
      # between runs on the same runner image.
      #
      # Classic mode rather than the manifest, so this installs TWO ports rather
      # than the project's whole dependency set — FFmpeg for arm64-android is
      # seventeen minutes and buys this check nothing. The cost is that these two
      # come from vcpkg's own baseline rather than the manifest's pinned one. A
      # header difference between them would surface here as a compile error,
      # which is a visible failure rather than a silent one.
      - name: SDL3 and glm for arm64-android
        run: |
          # EXPORTED IN THE SHELL, not through a step-level `env:` block. The
          # `env` context holds workflow/job/step variables only — it does not
          # contain the runner's own environment, so
          # `ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}` expands to the
          # empty string and vcpkg's android toolchain then fails to detect a
          # compiler at all.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # --classic is required, not optional: vcpkg finds the repo's own
          # vcpkg.json, switches to manifest mode, and manifest mode rejects
          # individual package arguments outright.
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --classic --triplet arm64-android \
              --x-install-root=/tmp/android-vcpkg glm sdl3
          ls /tmp/android-vcpkg/arm64-android/include

      - name: Cross-compile src/ for aarch64-linux-android
        run: |
          HOLOCRON_ANDROID_INCLUDE=/tmp/android-vcpkg/arm64-android/include \
              bash scripts/android-check.sh

  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact commit in vcpkg.json's builtin-baseline rather than
      # using the runner's preinstalled copy. The whole point of committing a
      # baseline is that the dependency set is reproducible; resolving it
      # against whatever the runner image happens to ship would defeat that.
      - name: Check out vcpkg at the pinned baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 39344dff01c5a5a0134caf2624cdd492f05d30ea
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # nasm is required to build ffmpeg's assembly-optimized codec paths.
      # vcpkg auto-downloads a portable nasm for the Windows triplet -- that is
      # why the Windows job needs nothing extra here -- but has no such fetch
      # path on Linux and fails the configure with a plain "please apt-get
      # install nasm". Discovered when this dependency first landed: the build
      # got as far as downloading ffmpeg's source before failing, so it is not
      # caught by a quick sanity check -- only by an actual CI run.
      - name: Install Ninja and nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm

      # RESTORE AND SAVE ARE SPLIT, AND THE SAVE IS CONDITIONAL. See #169, and
      # #49 before it -- this supersedes #49's fix rather than reverting it.
      #
      # THE PROBLEM #49 SOLVED, which still has to stay solved: a cancelled run
      # still executes its post-steps, so a combined actions/cache saves whatever
      # is in the archives directory AT THAT MOMENT -- a partial set. And
      # actions/cache never overwrites an existing key, so the run that then
      # completes properly logs "Cache hit occurred on the primary key, not
      # saving cache" and throws its complete archives away. The partial cache is
      # pinned to that key forever and every later run rebuilds the difference.
      #
      # Not theoretical: the Windows job restored 6 of 12 packages and rebuilt
      # the other six every run, ~23 min against 61 s for the whole Linux job.
      #
      # #49 fixed it by putting github.run_id in the key, so every run saves and
      # a partial cache is superseded rather than pinned. That worked, and it
      # accepted a cost in as many words: every run writes a new blob.
      #
      # THE COST CAME DUE ON 2026-08-09. 55 entries, 10.02 GB against a 10 GB
      # limit -- 26 Windows entries at 258 MB each. Over the limit GitHub evicts
      # least-recently-used, so a Windows restore can miss because a concurrent
      # Linux save just pushed it out, and the job rebuilds FFmpeg and the rest
      # from source. One Windows job ran for over an hour against the 2m37s every
      # run before it took.
      #
      # SO: KEY WITHOUT THE RUN ID, AND ONLY SAVE ON SUCCESS. `success()` is false
      # for a cancelled or failed run, so a partial archive set is never written
      # at all -- which is strictly better than writing it and superseding it
      # later. Only a run that finished has a complete set, and only that gets
      # saved. Growth becomes one blob per (OS, manifest content) instead of one
      # per run.
      #
      # `cache-hit != 'true'` skips the save when the exact key already matched,
      # because there would be nothing new in it.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Windows needs the MSVC environment before Ninja can find cl.exe, and
      # there is no generator shortcut: the runner has no Visual Studio instance
      # CMake's VS generator can locate. So vcvars is found through vswhere and
      # everything runs inside that one shell.
      #
      # Two traps, both hit for real during development:
      #   * vcvars64.bat OVERWRITES VCPKG_ROOT with Visual Studio's own bundled
      #     vcpkg, so it has to be set again afterwards or the manifest resolves
      #     against the wrong tree.
      #   * appending to %PATH% after vcvars in the same cmd line expands the
      #     PRE-vcvars value and wipes the compiler paths.
      - name: Configure, build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
                      -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                      -property installationPath
          if (-not $vsPath) { throw "No MSVC toolset found on this runner." }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          Write-Host "Using $vcvars"
          $vcpkg = "${{ github.workspace }}\vcpkg"
          cmd /c "call `"$vcvars`" >nul && set VCPKG_ROOT=$vcpkg&& cmake --preset windows && cmake --build --preset windows && ctest --preset windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Warnings are errors in both toolchains, so a green build also means the
      # tree is clean under /W4 on MSVC and -Wall -Wextra -Wconversion on gcc.
      # Those two disagree about enough that running only one would miss things
      # -- which is exactly what produced D-018.
      - name: Configure, build and test (Linux)
        if: runner.os == 'Linux'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cmake --preset linux
          cmake --build --preset linux
          ctest --preset linux

      # THE LICENCE NOTICE, CHECKED THROUGH THE SHIPPED BINARY.
      #
      # The test suite already compares the embedded bytes against
      # THIRD-PARTY-NOTICES.md, which catches a stale generated source in the
      # build tree. This checks the same property from the other end: it asks
      # the executable somebody would actually receive what notices it carries,
      # and diffs that against the file in the repository.
      #
      # It matters because M6's about panel is how LGPL-2.1 section 6 is
      # discharged on screen, and section 6 is about what the DISTRIBUTED
      # program displays. A build artifact agreeing with the repository is not
      # the same claim as the binary agreeing with it.
      #
      # Linux only, because the working tree is LF here. On Windows the checkout
      # is CRLF and both sides would carry it, so the comparison would pass but
      # would be comparing a different pair of files -- the unit test covers that
      # platform.
      - name: The shipped binary carries the current notices
        if: runner.os == 'Linux'
        run: |
          ./build/linux/bin/holocron --notices > /tmp/embedded-notices.md
          diff -u THIRD-PARTY-NOTICES.md /tmp/embedded-notices.md

      # AFTER the build, and only when it worked. See the long note above the
      # restore: this is what stops a cancelled or failed run pinning a partial
      # archive set, without needing a unique key per run to paper over it.
      #
      # One step for both platforms -- only one of the two build steps above ran,
      # and by the time control reaches here it succeeded.
      - name: Save vcpkg binaries
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

  hygiene:
    name: Repo hygiene (case + line endings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches any .gitattributes rule that would rewrite an already-committed
      # file. On a correctly normalized tree this is a no-op; if it produces a
      # diff, the working tree and the attribute rules disagree.
      - name: Line endings are already normalized
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Committed files disagree with .gitattributes. Run: git add --renormalize . && git commit"
            git diff --cached --stat
            exit 1
          fi

      # Two paths differing only in case cannot coexist on a case-insensitive
      # checkout: one silently clobbers the other. Free to prevent, painful to
      # discover after someone on Windows clones a broken tree.
      - name: No case-colliding paths
        run: |
          dupes=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Paths differing only by case:"; echo "$dupes"; exit 1
          fi

      # Batch files are CRLF by contract (section 4 of .gitattributes); nothing
      # else in the tree should carry a carriage return.
      - name: No stray CRLF in text files
        run: |
          bad=$(git grep -I --files-with-matches $'\r' -- . \
                  ':(exclude)*.bat' ':(exclude)*.cmd' ':(exclude)*.sln' \
                  ':(exclude)*.vcxproj' ':(exclude)*.props' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF in tracked text files:"; echo "$bad"; exit 1
          fi

      # A real gatekeeper.toml carries a Plex token. Once it lands in a public
      # repo that anyone has forked, rewriting history does not retract it.
      # Widened for issue #18: .gitignore treats six patterns as secret-bearing
      # and this step used to test exactly one of them. A check that covers a
      # sixth of what it claims to cover is worse than none, because the green
      # tick is read as "no secrets committed".
      - name: No secrets committed
        run: |
          bad=$(git ls-files | grep -E \
                  -e '(^|/)gatekeeper\.toml$' \
                  -e '(^|/)gatekeeper\.local\.toml$' \
                  -e '(^|/)secrets\.toml$' \
                  -e '\.token$' \
                  -e '(^|/)plex_token' \
                  -e '(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Secret-bearing files are committed:"; echo "$bad"; exit 1
          fi

      # Issue #18. Both files carry a comment telling the reader to keep their
      # media lists in sync, and until now nothing checked it. They serve
      # different purposes and drift is silent in BOTH directions:
      #
      #   * in .gitattributes but not .gitignore -> committable when it must not be
      #   * in .gitignore but not .gitattributes -> CORRUPTED if force-added,
      #     which is the exact failure the character-class work was done to prevent
      #
      # Only the AUDIO and VIDEO sections of .gitattributes are compared.
      # Its image and font sections deliberately have no .gitignore counterpart:
      # a PNG figure or a UI font is meant to be committable, a FLAC never is.
      # Comparing the whole binary section would demand a drift that should not
      # exist.
      - name: .gitignore and .gitattributes describe the same media set
        run: |
          # Character-class form is the discriminator: every media pattern is
          # written *.[wW][aA][vV] and nothing else in either file looks like it.
          ignore_list=$(grep '^\*\.\[' .gitignore | sed 's/[[:space:]].*//' | sort -u)

          attr_list=$(awk '
            /^# Audio/    { c = 1; next }
            /^# Video/    { c = 1; next }
            /^# Images/   { c = 0; next }
            /^# Fonts/    { c = 0; next }
            /^# Archives/ { c = 0; next }
            c && /^\*\./  { print $1 }
          ' .gitattributes | sort -u)

          # Guard the extraction before comparing, for the same reason the
          # version check does: two empty lists compare equal, so a rename of a
          # section header would turn this into a check that always passes.
          if [ -z "$ignore_list" ] || [ -z "$attr_list" ]; then
            echo "::error::media pattern extraction found nothing — section headers or pattern form must have changed"
            exit 1
          fi

          if ! diff <(echo "$ignore_list") <(echo "$attr_list") > /tmp/media-diff.txt; then
            echo "::error::.gitignore and .gitattributes disagree about the media set."
            echo "::error::'<' is in .gitignore only, '>' is in .gitattributes audio/video only."
            cat /tmp/media-diff.txt
            exit 1
          fi

          echo "both files describe the same $(echo "$ignore_list" | wc -l) media patterns"

      # Also issue #18. .editorconfig stops CRLF being written in the first
      # place; .gitattributes stops it surviving a round trip. Two halves of one
      # story, and they must not contradict each other.
      #
      # Note what `* text=auto` actually promises: LF in the REPOSITORY, native
      # in the working tree. So a Windows checkout legitimately holds CRLF and
      # the committed blob does not, which is why the CRLF check above is a
      # statement about tracked content and gives a false positive if run
      # against a Windows working tree. There is deliberately no `eol=lf` here --
      # forcing LF into the working tree would fight every Windows editor for no
      # benefit, since the blob is already normalized.
      - name: .editorconfig and .gitattributes agree on line endings
        run: |
          if ! grep -qE '^end_of_line[[:space:]]*=[[:space:]]*lf' .editorconfig; then
            echo "::error::.editorconfig no longer sets end_of_line = lf"; exit 1
          fi
          if ! grep -qE '^\*[[:space:]]+text=auto[[:space:]]*$' .gitattributes; then
            echo "::error::.gitattributes no longer normalizes tracked text with '* text=auto'"; exit 1
          fi
          echo "both agree: LF in the repository, native in the working tree"

      # Issue #33. Both failure modes here have actually happened, more than
      # once, and neither produces an error anywhere else: the result is still
      # valid UTF-8, just wrong, so nothing downstream complains.
      #
      # A BOM is unambiguous and worth failing on outright. U+FEFF has no
      # legitimate use in this tree, and it has been committed at the front of a
      # source file AND at the front of a git commit subject line.
      #
      # Mojibake is detected by SIGNATURE, which is a heuristic and is stated as
      # one. Double-encoding UTF-8 through a Latin-1 codepage rewrites each byte
      # of a multi-byte character as its own Latin-1 character, so an em dash or
      # a section sign turns into a short run of accented capitals and
      # punctuation. Those runs are effectively impossible in this project's
      # English technical prose and are trivially greppable.
      #
      # The patterns below are written as hex escapes and NOT spelled out in
      # this comment, for the reason given at the grep itself. A file that
      # legitimately needs such a sequence -- a fixture ABOUT encoding damage,
      # say -- would have to be excluded explicitly, which is the right amount
      # of friction.
      - name: No BOM or double-encoded text
        run: |
          bom=$(git grep -I -l -F -e $'\xef\xbb\xbf' -- . || true)
          if [ -n "$bom" ]; then
            echo "::error::UTF-8 BOM in tracked files (U+FEFF has no legitimate use here):"
            echo "$bom"
            exit 1
          fi

          # Signatures of UTF-8 decoded as Latin-1 and re-encoded, written as hex
          # escapes rather than as the characters themselves.
          #
          # That is not obfuscation, it is the only way this check can police the
          # file it lives in. Spelling the patterns literally puts the very byte
          # sequences being hunted into ci.yml, and the first run flagged this
          # workflow as the sole offender in the tree. Hex escapes keep the file
          # pure ASCII, so it is subject to its own rule.
          #
          #   \xc3\xa2\xe2\x82\xac  the "a-circumflex euro" opening of a
          #                         double-encoded em dash or curly quote
          #   \xc3\x82\xc2...       a double-encoded section sign, degree,
          #                         middle dot, guillemet
          #   \xc3\x83\xc2...       a double-encoded accented letter
          mojibake=$(git grep -I -l -F \
                       -e $'\xc3\xa2\xe2\x82\xac' \
                       -e $'\xc3\x82\xc2\xa7' \
                       -e $'\xc3\x82\xc2\xb0' \
                       -e $'\xc3\x82\xc2\xb7' \
                       -e $'\xc3\x82\xc2\xbb' \
                       -e $'\xc3\x82\xc2\xab' \
                       -e $'\xc3\x83\xc2\xa9' \
                       -e $'\xc3\x83\xc2\xa8' \
                       -e $'\xc3\x83\xc2\xbc' -- . || true)
          if [ -n "$mojibake" ]; then
            echo "::error::Double-encoded text in tracked files. The tell is a one-line edit"
            echo "::error::producing a diff that touches every line. Check the byte count."
            echo "$mojibake"
            exit 1
          fi

      # Issue #38. The version lives in three tracked files plus two wiki pages.
      # The wiki is a separate repository with no PR mechanism and CANNOT be
      # checked from here -- that is stated in the issue and restated here so
      # nobody reads a green check as covering it. Those two pages stay manual.
      - name: Version agrees across the tracked files
        run: |
          claude_ver=$(grep -oP 'Current version `v\K[0-9]+\.[0-9]+\.[0-9]+' CLAUDE.md || true)
          vcpkg_ver=$(grep -oP '"version-string": "\K[0-9]+\.[0-9]+\.[0-9]+' vcpkg.json || true)
          cmake_ver=$(grep -oP '^\s+VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt || true)

          # Guard the extraction BEFORE comparing. Three failed greps produce
          # three empty strings, which compare equal -- so the naive version of
          # this check passes loudest exactly when it has stopped working. If a
          # file is reformatted so a pattern no longer matches, that must be a
          # failure, not a silent pass.
          for pair in "CLAUDE.md:$claude_ver" "vcpkg.json:$vcpkg_ver" "CMakeLists.txt:$cmake_ver"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::No version found in ${pair%%:*} — the check cannot see it, so it is not checking it"
              exit 1
            fi
          done

          if [ "$claude_ver" != "$vcpkg_ver" ] || [ "$vcpkg_ver" != "$cmake_ver" ]; then
            echo "::error::version disagrees: CLAUDE.md=$claude_ver vcpkg.json=$vcpkg_ver CMakeLists.txt=$cmake_ver"
            exit 1
          fi

          echo "version $claude_ver agrees across all three tracked files"

          # On a tag, the three must also match the tag itself. This is the half
          # of #38 that catches a tag applied to the wrong commit, which the
          # file-to-file comparison cannot see.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            if [ "$tag_ver" != "$claude_ver" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in the tree ($claude_ver)"
              exit 1
            fi
            echo "tag $GITHUB_REF_NAME matches the tree"
          fi

      # Issue #265, and the same shape as #38 above with one difference that
      # decided the design: the source of truth is `gatekeeper.toml`, which is
      # GITIGNORED, so unlike the version there is nothing in the tree for CI to
      # compare a document against. `trim_ms` was re-measured on 2026-08-10 and
      # eight published documents went on quoting the superseded figure for a
      # day; it was found by an audit, because nothing could fail.
      #
      # docs/measurements.toml is the committed record that closes that, and the
      # script enforces it in both directions -- an undeclared quotation is an
      # error, and so is a declaration that no longer matches. The script rather
      # than inline YAML so the rack can run it before pushing, which is the same
      # reason scripts/android-check.sh is a script.
      - name: Documents agree with the measured values on record
        run: scripts/check-measurements.sh


      # THE WIKI IS A SEPARATE REPOSITORY AND WAS ENTIRELY UNGUARDED. Issue 316.
      #
      # It quotes both trims, the Shield's frame times and the compile figures
      # across four living pages, and `git ls-files` cannot see any of it -- so
      # issue 265's failure mode was reproduced one repository over, with nothing
      # able to fail.
      #
      # CLONED READ-ONLY AND NEVER PUSHED. This job checks; correcting the wiki
      # stays a human act, because a wiki edit is the sort of thing that should be
      # read before it lands.
      #
      # continue-on-error IS ON THE CLONE ONLY, NOT ON THE CHECK. A wiki that is
      # unreachable must not fail an unrelated pull request -- that is how a check
      # starts crying wolf and ends up ignored, which is the failure this script
      # exists to prevent. A wiki that IS reachable and disagrees is a real
      # failure and is reported as one.
      #
      # Time-Log and Decision-Log are exempt inside the script: they are
      # append-only records of what was believed at a dated moment, and a figure
      # in session 12's entry is not a claim about today.
      - name: Clone the wiki
        id: wiki
        continue-on-error: true
        run: git clone --depth 1 https://github.com/roguen/holocron.wiki.git "$RUNNER_TEMP/wiki"

      - name: The wiki agrees with the measured values on record
        if: steps.wiki.outcome == 'success'
        run: scripts/check-measurements.sh "$RUNNER_TEMP/wiki"

      - name: Say so if the wiki could not be reached
        if: steps.wiki.outcome != 'success'
        run: echo "::warning::the wiki could not be cloned, so its quotations were NOT checked"

  # ---------------------------------------------------------------------------
  # Packaging, for both destinations. Issue 293.
  #
  # STANDING RULE 5: "Every version and milestone release publishes for both and
  # deploys to both." Until this existed both artifacts were built by hand on one
  # machine -- and that is not a process complaint, it shipped a defect. v1.0.0's
  # Windows zip was a DEBUG build, importing ucrtbased.dll and the rest of the
  # non-redistributable debug CRT. It would not have launched for anyone else,
  # and nobody could have known, because the only machine that ever ran it is the
  # one that built it.
  #
  # ON TAGS ONLY, not on every pull request. The Android leg needs FFmpeg for
  # arm64-android, which is roughly seventeen minutes; the `android` job above
  # avoids it on purpose by installing two ports in classic mode. Paying that per
  # PR would buy nothing -- what a PR needs to know is whether the code compiles
  # for Android, and that job already answers it.
  #
  # workflow_dispatch is here so this can be rehearsed WITHOUT cutting a tag,
  # which matters: a packaging job whose first real run is a release is one whose
  # first real test is a release.
  # ---------------------------------------------------------------------------

  package-windows:
    name: Package (Windows)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out vcpkg at the pinned baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 39344dff01c5a5a0134caf2624cdd492f05d30ea
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # RESTORE ONLY, SHARING THE `build` JOB'S CACHE RATHER THAN KEEPING ONE.
      #
      # Same key, so this gets a free hit off whatever that job saved for the same
      # vcpkg.json -- and vcpkg's binary cache is keyed on port, triplet and
      # features rather than on the consumer's CMAKE_BUILD_TYPE, so a Debug build
      # job's archives serve this Release one unchanged.
      #
      # NO SAVE STEP, deliberately. The long note in the build job records that
      # this project has already hit GitHub's 10 GB cache limit -- 55 entries,
      # 10.02 GB, with Windows entries at 258 MB each -- and that eviction there
      # made a Windows restore MISS and rebuild FFmpeg from source for over an
      # hour. A second saver on the same key would add blobs and buy nothing,
      # since the build job runs on every push and pull request and this one runs
      # only on tags.
      #
      # Without this, the first rehearsal run of this job spent its whole time
      # building FFmpeg from source. Measured, not assumed.
      - name: Restore vcpkg binaries (from the build job's cache)
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-Windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-Windows-

      # THE `windows-release` PRESET, AND THAT IS THE WHOLE POINT OF THIS JOB.
      #
      # `scripts/build.cmd` and the `windows` preset both configure Debug, which
      # is right for developing and wrong for anything published. The distinction
      # is invisible on the build machine -- a Debug binary runs perfectly well
      # where Visual Studio is installed -- so nothing but a deliberate choice
      # here prevents it.
      #
      # The CRT check runs in the SAME cmd invocation, because dumpbin is only on
      # PATH inside a vcvars environment and hunting for it under Program Files
      # is slower and breaks whenever Visual Studio moves it.
      - name: Configure, build Release, and refuse a debug CRT
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $vcpkg  = Join-Path $PWD 'vcpkg'
          cmd /c "call `"$vcvars`" >nul && set VCPKG_ROOT=$vcpkg&& cmake --preset windows-release && cmake --build --preset windows-release && dumpbin /IMPORTS build\windows-release\bin\holocron.exe > imports.txt"
          if ($LASTEXITCODE -ne 0) { throw "the Release build failed" }

          # A binary importing the debug CRT cannot run on a machine without
          # Visual Studio, and that is exactly what shipped as v1.0.0. Checked
          # rather than trusted: the preset above is one edit away from being
          # wrong again, and the symptom only ever appears on somebody else's
          # computer.
          #
          # THE PATTERN COVERS FOUR NAMES, NOT THREE. A real Debug build of this
          # project imports ucrtbased.dll, MSVCP140D.dll, VCRUNTIME140D.dll AND
          # VCRUNTIME140_1D.dll -- measured on 2026-08-13. An earlier draft listed
          # the first three, so a build importing only the fourth would have
          # passed. Matched by shape rather than by a list.
          $bad = Select-String -Path imports.txt -Pattern 'ucrtbased\.dll|VCRUNTIME140[^.]*D\.dll|MSVCP140[^.]*D\.dll|CONCRT140D\.dll'
          if ($bad) {
            Write-Host "::error::This build imports the non-redistributable debug CRT and would not launch for anyone else."
            $bad
            exit 1
          }

          # AND THE CHECK MUST HAVE ACTUALLY LOOKED AT SOMETHING.
          #
          # "no matches" and "no output at all" are the same result to the test
          # above, and the second is reachable: while writing this, the identical
          # check run locally reported a clean Debug binary because Git Bash had
          # rewritten `/IMPORTS` into a path and dumpbin never dumped anything.
          # The wrong answer was confident and looked exactly like the right one.
          #
          # So require the RELEASE runtime to be present. A holocron.exe that
          # imports neither the debug CRT nor the redistributable one is not a
          # clean build, it is a check that read an empty file.
          $good = Select-String -Path imports.txt -Pattern 'VCRUNTIME140\.dll|MSVCP140\.dll|api-ms-win-crt-runtime'
          if (-not $good) {
            Write-Host "::error::dumpbin produced no recognisable CRT imports at all, so the debug-CRT check proved nothing. Look at imports.txt."
            Get-Content imports.txt -TotalCount 20
            exit 1
          }
          Write-Host "no debug CRT imports, and the redistributable runtime is present -- this binary can run without Visual Studio installed"

      - name: Stage the zip
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+(\d+\.\d+\.\d+)' |
              Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw "could not read VERSION out of CMakeLists.txt" }
          Write-Host "version $version"

          $stage = "staging/holocron-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # NOT `bin/*`. The `windows-release` preset is RelWithDebInfo, so the
          # output directory also holds .pdb symbol files and .ilk incremental
          # link files -- and copying the lot took the first rehearsal's zip to
          # 21 MB against the 9.46 MB that shipped as v1.0.1. The .ilk is a build
          # intermediate with no value to anybody; the .pdb is real but belongs
          # with whoever is debugging a crash rather than in every download.
          Get-ChildItem build/windows-release/bin -File |
              Where-Object { $_.Extension -notin '.ilk', '.pdb' } |
              Copy-Item -Destination $stage -Force

          # The vault travels with the binary or there is nothing to draw. The
          # licence texts are an OBLIGATION rather than a courtesy -- and they
          # are compiled into the executable as well (cmake/embed_notices.cmake),
          # which is deliberate: an obligation met only when a file happens to
          # sit beside the binary is not met.
          Copy-Item crystals $stage -Recurse -Force
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md, gatekeeper.example.toml $stage -Force

          $asset = "holocron-$version-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep it whatever happens
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.ASSET }}

      # Only on a tag. A workflow_dispatch run is a rehearsal and must not touch
      # a published release.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber

  package-android:
    name: Package (Android APK)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # FAIL HERE, BEFORE SEVENTEEN MINUTES OF FFmpeg, AND FAIL LOUDLY.
      #
      # `scripts/android-apk.sh` GENERATES A NEW KEYPAIR when the keystore is
      # absent. Inheriting that silence here would mean every CI build carried a
      # different signature -- and Android refuses to update an installed app
      # whose signature differs, so the only way through is an uninstall, which
      # wipes the app's gatekeeper.toml, machine identifier and Plex token. That
      # is a re-provisioning per build rather than an install error, and it would
      # be discovered by somebody trying to update the Shield rather than here.
      - name: The signing key, or nothing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to let"
            echo "::error::android-apk.sh mint a throwaway key -- a differently"
            echo "::error::signed APK cannot update the one installed on the Shield."
            echo "::error::Set it from the backup in the holocron-config repo:"
            echo "::error::  base64 -w0 shield/debug.keystore | gh secret set ANDROID_KEYSTORE_BASE64 -R roguen/holocron"
            exit 1
          fi
          mkdir -p build/android
          echo "$KEYSTORE_B64" | base64 -d > build/android/debug.keystore
          # A truncated secret still decodes to SOMETHING, so check it is a
          # keystore rather than merely non-empty. The password is `android` and
          # is hardcoded in android-apk.sh; it is not a secret, and what matters
          # about this file is continuity rather than confidentiality.
          keytool -list -keystore build/android/debug.keystore -storepass android > /dev/null
          echo "the signing key is present and readable"

      - name: Check out vcpkg at the pinned baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 39344dff01c5a5a0134caf2624cdd492f05d30ea
          path: vcpkg
          fetch-depth: 1

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: nasm and ninja, for FFmpeg's assembly paths
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm

      # NO vcpkg BINARY CACHE HERE, AND THAT IS DELIBERATE RATHER THAN AN
      # OVERSIGHT. IT COSTS ABOUT SEVENTEEN MINUTES PER RELEASE AND BUYS
      # DETERMINISM.
      #
      # `scripts/android-apk.sh` takes SDL's Java from the vcpkg BUILDTREE --
      # `buildtrees/sdl3/src/*/android-project/...` -- which exists only when
      # vcpkg actually COMPILED sdl3. Restore a binary archive and the port is
      # unpacked rather than built, the buildtree never appears, and the script
      # stops with "SDL's Java sources are not in the vcpkg buildtree."
      #
      # THAT FAILS ON THE SECOND RUN AND NEVER THE FIRST, which is the worst
      # shape a CI job can have. Measured: rehearsal one had no cache, built SDL
      # from source and produced a signed APK; rehearsal two restored what
      # rehearsal one saved and failed at packaging. A single green run would
      # have been read as proof, and the real failure would have arrived on a
      # release.
      #
      # Taking SDL's Java from the buildtree is itself deliberate --
      # android-apk.sh explains that vendoring it lets the Java and native halves
      # drift, with the failure being an UnsatisfiedLinkError on a device rather
      # than a compile error. So the buildtree stays, and the cache goes.
      #
      # The better fix, when this becomes worth the effort: teach the script to
      # accept the Java path from the environment, and have CI check out
      # libsdl-org/SDL at whatever version the baseline pins. That needs the
      # version resolved from vcpkg at runtime and is a change to the script's
      # contract, so it is not being done inside a packaging fix.
      #
      # This job runs on tags only -- a handful of times a year -- so the trade is
      # cheap. The `build` and `android` jobs, which run constantly, keep theirs.

      # THE MANIFEST, not classic mode. The `android` job above installs two
      # ports classically precisely to avoid FFmpeg; this one is packaging
      # something that has to RUN, so it needs the real dependency set at the
      # pinned baseline.
      - name: Configure and build for arm64-android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_NDK_HOME" || { echo "::error::no NDK on this runner"; exit 1; }
          cmake -S . -B build/android -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=arm64-android \
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-30
          cmake --build build/android

      # And the buildtree really must be there, said out loud BEFORE the script
      # reaches it. Without this the failure reads as a packaging problem when it
      # is a caching one, which is how twenty-five minutes was spent looking in
      # the wrong place.
      - name: SDL's Java must have been built, not unpacked
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          found=""
          for c in "$VCPKG_ROOT"/buildtrees/sdl3/src/*/android-project/app/src/main/java; do
              [ -d "$c" ] && found="$c" && break
          done
          if [ -z "$found" ]; then
            echo "::error::No SDL Java in the vcpkg buildtree. That means sdl3 came"
            echo "::error::from a BINARY ARCHIVE rather than being compiled, which"
            echo "::error::happens when a vcpkg cache is restored into this job."
            echo "::error::This job must build from source -- see the comment above."
            ls -la "$VCPKG_ROOT/buildtrees" 2>/dev/null || echo "(no buildtrees at all)"
            exit 1
          fi
          echo "SDL's Java is at $found"

      # The script's own stale-library guard is what makes this safe to run
      # unattended: it refuses when the .so is older than any source that feeds
      # it, which is the failure that produced a signed, verified APK containing
      # none of a day's work.
      - name: Package and sign
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: bash scripts/android-apk.sh

      - name: Name it for the release
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\).*/\1/p' CMakeLists.txt | head -1)
          test -n "$version" || { echo "::error::could not read VERSION out of CMakeLists.txt"; exit 1; }
          echo "version $version"
          cp build/android/apk/holocron.apk "holocron-$version-arm64-android.apk"
          echo "ASSET=holocron-$version-arm64-android.apk" >> "$GITHUB_ENV"

      - name: Keep it whatever happens
        uses: actions/upload-artifact@v4
        with:
          name: arm64-android
          path: ${{ env.ASSET }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
