# SPDX-License-Identifier: GPL-3.0-or-later
#
# THE MEASURED VALUES THIS PROJECT QUOTES IN PROSE.
#
# This file exists because of issue 265. `trim_ms` was re-measured on 2026-08-10
# and correctly recorded in `gatekeeper.toml`, which is gitignored -- and eight
# published documents went on quoting the superseded figure. It was found by an
# audit, because nothing could fail.
#
# WHAT THIS FILE IS, AND WHAT IT IS NOT.
#
# It is the source of truth for every DOCUMENT that quotes a measured value. It
# is NOT the source of truth for the PROGRAM: `gatekeeper.toml` still is, it is
# still gitignored, and nothing here is read at runtime. The two are joined by a
# human, and that join is the one step the check below cannot make for you --
# when you re-measure, update this file, and everything that quotes it then goes
# red until it agrees.
#
# `scripts/check-measurements.sh` enforces two rules over every tracked `.md`
# and `.toml`, in both directions:
#
#   1. A block that quotes a value recorded here must DECLARE which measurement
#      it is quoting, with a marker. An undeclared quotation is an error, which
#      is what stops a new document from silently starting to drift.
#
#   2. A block that declares a measurement must actually quote its CURRENT
#      value. This is the half that catches the 265 failure: change `value`
#      below and every stale document fails by name.
#
# The marker is invisible when rendered, and takes one form per file type:
#
#   Markdown   <!-- measured: trim_ms.rack -->
#   TOML       # measured: trim_ms.rack
#
# A marker alone on its line covers the block that follows it -- everything down
# to the next blank line. Several markers may stack above one block when it
# quotes more than one measurement.
#
# TO QUOTE A SUPERSEDED VALUE ON PURPOSE, declare the dated key instead:
# `trim_ms.rack@2026-08-04`. Saying which of the two you mean is the entire
# point; a document that says -90 without saying "until 2026-08-10" is the bug.
#
# `value` IS A STRING, NOT A NUMBER, and deliberately. The check matches the
# token as it is written in prose. TOML would read `-30` and `-30.0` as the same
# float while they are different characters on a page, and it is the characters
# that go stale.

# --------------------------------------------------------------------------
# The audio/video trim. See docs/calibrating-sync.md for the procedure, why it
# is hard to measure well, and the five instruments that failed before this one.
# --------------------------------------------------------------------------

[[measurement]]
key        = "trim_ms.rack"
value      = "-30"
unit       = "ms"
measured   = "2026-08-10"
subject    = "the rack"
conditions = "RX 6800 -> Onkyo TX-RZ720 in Direct -> BenQ TK800 at 4K 60 Hz RGB 8-bit; WASAPI exclusive, 160-frame period"
bracket    = "late at 0, early at -50, midpoint -25, taken as -30 on the 5 ms grid --calibrate steps in"
resolution = "about +/-25 ms"
config     = "gatekeeper.toml [audio] trim_ms"
issue      = 265
note       = """
A trim is a property of the whole rack, and THE REFRESH RATE IS PART OF THE \
RACK. This reading replaced -90 after the projector evening changed the link \
from 4K 29 Hz RGB 10-bit to 4K 60 Hz 8-bit; two refreshes of vsync'd present \
pipeline went from 69 ms to 33 ms, which accounts for about 36 of the 60 ms \
move. Negative because the projector is slower than the audio path.\
"""

[[measurement]]
key        = "trim_ms.rack@2026-08-04"
value      = "-90"
unit       = "ms"
measured   = "2026-08-04"
superseded = true
subject    = "the rack, at 4K 29 Hz RGB 10-bit"
conditions = "RX 6800 -> Onkyo TX-RZ720 in Direct -> BenQ TK800 at 4K 29 Hz RGB 10-bit; WASAPI exclusive, 160-frame period"
bracket    = "early at -135, late at -50, midpoint -92.5, taken as -90"
resolution = "about +/-42 ms"
issue      = 265
note       = """
KEPT BECAUSE IT IS QUOTED ON PURPOSE, in the documents that explain why the \
figure moved. Three independent estimates agreed on it at the time -- this \
bracket gave -92.5, an earlier sweep against real music gave -85, and the \
arithmetic predicted about -88 -- which is what made it a property of the rack \
rather than of whatever was playing. It was still correct. It is simply no \
longer current, and every document that names it has to say so.\
"""

# --------------------------------------------------------------------------
# How often Plex's photo transcoder hands back a PNG. Issue 116.
#
# TWO KEYS FOR ONE MEASUREMENT, deliberately. Prose quotes this as "157 of 2,450"
# and as "6.4%" and often only one of the two, so a single key would leave the
# other spelling unguarded -- which is exactly the 265 failure. Stack both markers
# above a block that quotes both.
# --------------------------------------------------------------------------

[[measurement]]
key        = "artwork_png.count"
value      = "157"
unit       = "album thumbs, of 2,450"
measured   = "2026-08-13"
subject    = "the reference Plex library"
conditions = "Plex Media Server 1.43.3.10828 on the Garage67 NAS; every album in all three artist-type sections requested through /photo/:/transcode at 512x512 with minSize=1&upscale=1 and Accept: image/jpeg -- exactly what artwork_path() sent before this measurement. Classified by the first bytes of the body, never the content type"
bracket    = "a census, not a sample: 2,450 of 2,451 album thumbs answered, one 500s"
resolution = "exact, for this library on this day"
issue      = 116
note       = """
THE ENDPOINT IS CALLED /photo/:/transcode AND IT DOES NOT TRANSCODE. It resizes \
and passes the source format through, so a sleeve stored as a PNG came back as \
PNG -- and at the time of this census this FFmpeg had no PNG decoder, so the art \
and the album's palette were lost together. (THAT SECOND HALF IS NO LONGER TRUE: \
ffmpeg's `zlib` feature was added when local-file artwork needed it for real, so \
a PNG decodes now. The census stands as measured -- it records what the SERVER \
sends, which has not changed, and `&format=jpeg` is still the right fix for \
FETCHED art because it avoids a decode rather than relying on one.) \
Every one of the 157 was labelled `image/jpeg` regardless, \
and `Accept: image/jpeg` on the request changed nothing.Adding `&format=jpeg` \
takes it to 0 of 2,450. The spelling is load-bearing: `format=jpg` and \
`format=JPEG` are accepted, ignored and answered with the source format, with no \
error.Split by section, because the rate is not uniform and a music-only reading \
would have understated it: 31 of 1,998 in Music (1.6%), 126 of 447 in AudioBooks \
(28.2%), 0 of 5 in Radio Dramas.THIS WILL DRIFT as albums are added, and that is \
fine -- what it records is that the rate was NOT ZERO, which is the claim the \
four documents saying PNG was "moot while Plex serves JPEG" got wrong. Re-measure \
only if the question comes back.\
"""

[[measurement]]
key        = "artwork_png.rate"
value      = "6.4"
unit       = "% of album thumbs"
measured   = "2026-08-13"
subject    = "the reference Plex library"
conditions = "the same census as artwork_png.count -- see that entry for the method, the per-section split and why the parameter spelling matters"
bracket    = "157 of 2,450"
resolution = "exact, for this library on this day"
issue      = 116
note       = """
THE SAME MEASUREMENT AS artwork_png.count, recorded separately only so that prose \
quoting the percentage without the counts is guarded too.\
"""

[[measurement]]
key        = "trim_ms.shield"
value      = "260"
unit       = "ms"
measured   = "2026-08-12"
subject    = "the Shield"
conditions = "NVIDIA Shield Android TV Pro -> Onkyo TX-RZ720 on STRM BOX (SLI11) -> BenQ TK800; 1920x1080 upscaled to a 4K 59.94 signal; SDL audio at 44.1 kHz, 882-frame period, AudioFlinger resampling to 48 kHz below the frame counter"
bracket    = "clearly early at +220, clearly late at +295, midpoint +257.5, taken as +260 on the 5 ms grid"
resolution = "about +/-37.5 ms"
config     = "the Shield's gatekeeper.toml, [audio] trim_ms"
issue      = 278
note       = """
POSITIVE, AND THAT IS THE WHOLE STORY OF THIS NUMBER. Every trim this project had recorded was negative -- the rack is -30 -- because a projector is slower than a PC's audio path and the picture has to be pulled earlier. The Shield is 290 ms the other way.The reason is where the clock is taken. `played_us` comes from SDL's frame counter, which sits ABOVE AudioFlinger's own buffering, so there is output latency below it that the player cannot see. The sound arrives later than the clock claims, the picture reads as early, and correcting it needs a large positive trim. Same room, same receiver, same projector as the rack: the display half of the subtraction is shared and the AUDIO half is not.It cost a false start. The first attempt swept -60 to +80 in 25 ms steps, saw nothing move, and was reported as the trim having no effect -- measured afterwards, the trim was correct to the millisecond and 140 ms of sweep was simply nowhere near far enough. The tool gained +/-100 steps (issue 304)."""

# --------------------------------------------------------------------------
# How often extract_palette called a sleeve black. Issue 297.
#
# TWO KEYS FOR ONE MEASUREMENT, on the same reasoning as artwork_png above:
# prose quotes the before and the after separately and often only one of them,
# so a single key would leave the other spelling unguarded.
#
# BOTH VALUES CARRY THEIR DENOMINATOR, AND THAT IS NOT STYLE. The scanner looks
# for the value as text anywhere in a document, so a bare "4" or "12" matches an
# issue number, a port, a version and a list item -- the first attempt at these
# two keys flagged nineteen innocent lines across shield.md and
# gatekeeper.example.toml. A measured quantity whose value is a small integer
# has to be written so that quoting it is unambiguous, which is a real
# constraint on this record and worth knowing before adding the next one.
# --------------------------------------------------------------------------

[[measurement]]
key        = "palette_black.before"
value      = "12 of 18"
unit       = "sleeves whose primary is effectively black"
measured   = "2026-08-13"
subject    = "extract_palette at v1.0.2, before the weighting was corrected"
conditions = "eighteen real album thumbs pulled from the reference Plex library and kept on disk; decoded through the real decode_image and passed to the real extract_palette; a primary counted as black when its relative luminance is below 0.05, which is where pulse's ring stops being visible against its own ground"
bracket    = "a census of the eighteen, not a sample of a library"
resolution = "exact, for these eighteen sleeves"
issue      = 297
note       = """
THE POINT OF THIS NUMBER IS THAT THE BRIGHT SLEEVES ARE IN IT. Abbey Road -- four \
men crossing a sunlit street -- came back at 0.007, and Unknown Pleasures and \
twenty one pilots at 0.000. So the defect was never the dark-cover case issue 297 \
was filed about, and the issue's own three-way list ruled out fixing the \
extraction on the premise that the extraction was honest.The cause is the \
LIGHTNESS FLOOR rather than the parabola it floors. The bare parabola returns 0.36 \
at a tenth of full lightness and the 0.15 additive floor took that to 0.456, so a \
near-black region needed to be only about 2.2x more populous to be called the \
record's dominant colour. A border or a surround is routinely twenty times its \
subject.RE-MEASURE ONLY against these same eighteen files. A different set of \
sleeves is a different measurement and must get a different key.\
"""

[[measurement]]
key        = "palette_black.after"
value      = "4 of 18"
unit       = "sleeves whose primary is effectively black"
measured   = "2026-08-13"
subject    = "extract_palette with light_term = 0.001 + 0.999 * parabola^4"
conditions = "the same eighteen sleeves and the same 0.05 threshold as palette_black.before -- see that entry for the method"
bracket    = "a census of the eighteen"
resolution = "exact, for these eighteen sleeves"
issue      = 297
note       = """
THE FOUR THAT REMAIN ARE THE CORRECT ANSWER AND NOT A RESIDUE. They are records \
that really are almost entirely dark; the Metallica sleeve has 89% of its pixels \
in the darkest tenth of the lightness range. Promoting a stray highlight to "the \
colour of this record" would be a worse bug than the one being fixed and a \
quieter one, and there is a test asserting a black record still comes back \
black.THE FLOOR IS NOT CARRYING THIS. 0.0, 1e-4, 5e-4, 1e-3 and 3e-3 all give the \
identical primary on all eighteen; the fourth power is what moves the number. The \
floor is there for the degenerate image only -- the parabola is exactly zero at \
pure black and pure white, so without one a single stray dark pixel outranks an \
entire sheet of paper.\
"""
