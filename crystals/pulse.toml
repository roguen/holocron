# The reference crystal.
#
# Deliberately the simplest thing that is still a real crystal: it binds one
# scalar, one phase and one array, which covers every binding kind the loader
# supports. If the pipeline is broken, this is the file to test against before
# suspecting anything more interesting.

name = "pulse"

# Provenance. First-party, so there is no source_url.
#
# Not required -- a crystal that declares nothing is taken as the project's own,
# and the loader never refuses anything over this. It is filled in here because
# this is the file people copy when starting a crystal of their own, so the keys
# should be visible in use.
#
# The rule these serve applies only to crystals COMMITTED TO THIS DIRECTORY,
# which is public and therefore published. A crystal in a vault of your own is
# private use and raises no licence question at all -- adapt whatever you like
# and point --vault at it.
author  = "Roguen Keller"
license = "GPL-3.0-or-later"

# Each key is a GLSL uniform in pulse.frag. Each value is a field on AudioFrame,
# spelled exactly as docs/audio-frame.md spells it.
#
# The names are checked AT LOAD TIME against the contract. A typo here is an
# error listing the valid vocabulary, not a uniform that silently stays zero.
[uniforms]
u_bass      = "bass_norm"
u_treble    = "treble_norm"
u_beat      = "beat_phase"
u_onset     = "onset_strength"
u_bands     = "band_norm"
u_centroid  = "spectral_centroid"
