# The calibration instrument, loaded by `holocron --calibrate`.
#
# It lives in instruments/ rather than in crystals/ on purpose. crystals/ is the
# VAULT -- the things you actually want to look at, cycled with the arrow keys --
# and putting a measuring tool in it would mean hitting a strobing white screen
# every time you paged past. Different directory, different job.
name = "sync"

author  = "Roguen Keller"
license = "GPL-3.0-or-later"

[uniforms]
# The measurement. A boolean, true for one analysis frame at the transient --
# no envelope and no tracker between the audio and the pixel.
u_hit   = "onset"
# For comparison only: the envelope, whose peak lags the transient.
u_onset = "onset_strength"
# Reference, deliberately not the thing to calibrate against -- the tracker's
# phase relative to the drums varies by over 100 ms between tracks.
u_beat  = "beat_phase"
