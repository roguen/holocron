# gatekeeper.example.toml
#
# The committed template. Copy it to `gatekeeper.toml` beside the executable and
# edit that copy:
#
#     cp gatekeeper.example.toml gatekeeper.toml
#
# `gatekeeper.toml` is gitignored and MUST stay that way -- it holds a Plex token.
# The loader reads `gatekeeper.toml` only and never this file, so an unedited
# checkout runs on defaults rather than on the example's placeholder values.
#
# Every value here IS the default. Deleting a key is the same as leaving it, so
# a working config can be as short as the two or three lines you actually changed.
#
# STATUS: partly read. Keys marked LIVE below are loaded and acted on; the rest
# are specification the loader has not caught up with, and setting one does
# nothing at all.
#
# That gap is deliberate rather than an oversight. Parsing a key into a struct
# nobody reads would make the config LOOK implemented while silently ignoring
# what you set, which is a worse failure than an honest hole -- so a setting that
# does nothing is left visibly unmarked instead of quietly accepted.
#
# PRECEDENCE: a command-line flag beats this file, and this file beats the
# built-in default. A flag is what you reach for to try something once, so it has
# to win against a file you edited a month ago.
#
# WHAT IS DELIBERATELY NOT HERE, AND WHY.
#
# An Activity launch on Android passes no argv, so a flag with no key here is
# unreachable on a television. Every flag that names a DURABLE PREFERENCE now has
# one. The rest are argv-only on purpose, in three groups:
#
#   Modes that print and exit          --help, --notices, --list-bindings,
#                                      --link, --discover, --calibrate
#     Each needs a terminal to read the answer off, and each has a route on a
#     device that does not: the notices are on F1 and the phone, the trim is on
#     /control/tuning, and --link runs on any machine carrying the target's
#     machine identifier (D-059). A config key would ask a television to enter a
#     mode it cannot report the result of.
#
#   Verification aids for --frames/--shot   --overlay, --colophon-page, --frames,
#                                           --shot
#     These exist so a screenshot can capture a state that is otherwise only
#     reachable over HTTP. On a device there IS a screen, and
#     `adb exec-out screencap -p` is a better instrument than --shot -- which
#     writes to the working directory, and an Android process has cwd `/`.
#
#   Bootstrap                          --config
#     It names this file. It cannot live in it.
#
# The once-off overrides -- --no-audio, --no-watch, --no-compositor,
# --no-discover, --no-herald, --fullscreen/--windowed -- all have keys, and the
# flag wins over the file in every case.
#
# An UNRECOGNISED key is ignored without complaint, because an unedited copy of
# this template is full of them. A key that IS live and holds a bad value is
# fatal -- silently falling back to a default would mean the trim you measured
# stops being applied and nothing says why.


# ---------------------------------------------------------------------------
# [audio] -- the output device and the one number only you can measure
# ---------------------------------------------------------------------------
[audio]

# Which backend to use: "auto", "wasapi", or "sdl".
#
# auto prefers WASAPI exclusive, falls back to WASAPI shared, then SDL. Exclusive
# mode is the only bit-perfect path; shared goes through the Windows mixer and is
# not bit-perfect, though it still provides a real device clock.
#
# LIVE. Today also: --sink
backend = "auto"

# Open an audio device at all.
#
# False decodes and analyses and draws, and opens nothing -- which is how the
# renderer is checked on a machine whose audio device is busy, and how a run is
# made silent without unplugging anything. The visuals are unaffected: they are
# driven by the analysis, which happens either way.
#
# `--no-audio` does the same for one run and still wins. Here because an Activity
# launch passes no argv (issue 242). LIVE.
enabled = true

# Empty means the system default playback device. Set it to a substring of the
# endpoint's friendly name to pin a specific one -- useful when the receiver is
# not the default, e.g. "AV Receiver".
device = ""

# EXCLUSIVE MODE NEEDS TWO CHECKBOXES IN WINDOWS, AND THE SECOND IS NOT OBVIOUS.
#
#   Sound > Playback > (your device) > Properties > Advanced
#     [x] Allow applications to take exclusive control of this device
#     [x] Give exclusive mode applications priority
#
# The first permits exclusive mode at all. The SECOND is what lets it preempt a
# stream that is already running -- without it, opening exclusively fails with
# "device busy" whenever anything else is playing, which on a desktop is most of
# the time. Both are needed. Holocron prints which one is missing.

# Hand trim between what you HEAR and what you SEE, in milliseconds. Positive
# values make the picture wait.
#
# IT IS A DIFFERENCE, NOT A LATENCY, AND THAT IS THE THING TO UNDERSTAND HERE:
#
#     trim = audio latency after the device clock  -  display latency
#
# The analysis tap is placed against the device clock, which is accurate to what
# the sink reports and blind to everything after it -- the DAC, the HDMI link,
# the receiver's own processing. But you judge this by watching a SCREEN, and the
# screen has input lag of its own pushing the other way. What you are trimming is
# what is left over when those two cancel.
#
# The practical consequence: this value belongs to a whole rack, not to the
# receiver. Changing the display, or taking the receiver out of a direct mode
# into one that does real processing, invalidates it. Re-measure after either.
#
# Asking "early or late" is a direction judgement, which the eye is good at;
# asking "is it aligned" is a coincidence judgement, which it is not, and which
# has no moment where the answer announces itself. So the value is bracketed
# from both sides rather than hunted for, and the midpoint is the answer.

# measured: trim_ms.rack
# MEASURED ON ONE RACK, 2026-08-10: -30 ms. RX 6800 into an Onkyo TX-RZ720 in
# DIRECT, out to a BenQ TK800 projector at 4K 60 Hz RGB 8-bit; WASAPI exclusive,
# 160-frame period. NEGATIVE, because the projector is slower than the audio
# path. Clearly LATE at 0, clearly EARLY at -50, midpoint -25, taken as -30 on
# the 5 ms grid --calibrate steps in, so the resolution is about +/-25 ms.

# measured: trim_ms.rack@2026-08-04
# IT READ -90 UNTIL THEN, measured on 2026-08-04 on the same boxes at 4K 29 Hz
# RGB 10-bit: early at -135, late at -50, midpoint -92.5, resolution +/-42 ms.
# Three independent estimates agreed on it, which is what made it a property of
# the rack rather than of whatever was playing. Changing the refresh rate changed
# the trim by 60 ms. THE REFRESH RATE IS PART OF THE RACK.
#
# Both figures, with their brackets and dates, are recorded in
# docs/measurements.toml, and scripts/check-measurements.sh fails CI if this
# comment and that record ever disagree. Issue 265: this paragraph is the one
# that quietly kept saying -90 for a day after the re-measurement.

# The projector's RATED input lag is 44 ms, and the real figure is about double
# that. A rated number is measured at 1080p, usually to mid-frame, and does not
# include 4K/HDR processing or the one-to-two refreshes of vsync'd present
# pipeline between drawing a frame and it reaching the screen. Expect roughly
# twice any published input-lag figure, and measure rather than deriving it.
#
# HOW TO MEASURE IT: docs/calibrating-sync.md.
#
# That is the canonical procedure and it is not repeated here, because two copies
# of the same instructions drift and this project has been bitten by exactly that
# before. In brief:
#
#   scripts\make-calibration-tone.ps1
#   holocron.exe calibration-tone.wav --calibrate --trim-ms 0
#
# Then sweep to clearly EARLY, note it; to clearly LATE, note it; take the
# midpoint. Ask "early or late", never "is it aligned" -- direction is a
# judgement the eye can make and coincidence is not.
#
# The document also records the five instruments that failed before this one, and
# why each looked reasonable until it was used. Worth reading before re-measuring:
# every one of them is easy to reinvent.
#
# LIVE. Today also: --trim-ms.
trim_ms = 0.0

# How far the analysis may run ahead of the speakers, in milliseconds.
#
# THIS IS THE BUDGET A NEGATIVE trim_ms SPENDS, and it is the setting to reach
# for when the picture LAGS the sound rather than leading it.
#
# A negative trim asks for a frame ahead of the playback point, which can only be
# drawn if the decoder has already produced it. That is bounded by the PCM ring,
# so this sizes the ring in TIME. Push trim_ms past this and nothing further
# happens; the player says so rather than leaving you to wonder whether the trim
# is working.
#
# Periods were the wrong unit, and this used to be sized in them. Sixteen device
# periods bought about 58 ms in WASAPI exclusive mode and roughly 160 ms in
# shared mode, so the lead available depended on which backend happened to open.
#
# 250 ms comfortably covers a television's input lag, which is the usual reason a
# picture lags the sound. The cost is decode running further ahead -- about 96 KB
# of buffer, and a proportionally longer prefill before the first sound.
#
# LIVE.
lead_ms = 250.0


# ---------------------------------------------------------------------------
# [analysis] -- how the numbers behave, NOT what they mean
# ---------------------------------------------------------------------------
#
# NOTHING HERE CHANGES THE MEANING OF AN AudioFrame FIELD, and that boundary is
# the point of the section rather than an accident of what happened to be
# tunable.
#
# The band edges (30 Hz .. 16 kHz), the 32 band count, the bass/mid/treble
# crossovers and the 48 kHz analysis rate are all fixed `constexpr` and are
# deliberately ABSENT from this file. A crystal binding `band[5]` or `bass_norm`
# must get the same span on every install, or the same crystal quietly looks
# wrong on someone else's machine with no error and no way to detect it. See
# Decision-Log O-004 and issue #30.
#
# What is tunable here is how values MOVE -- attack, decay, gain response. Those
# change the feel and cannot change the meaning.
[analysis]

# Envelope time constants, seconds to 63%. Smaller attack is snappier; larger
# decay holds longer. See docs/audio-frame.md section 4.
band_attack      = 0.01
band_decay       = 0.25
aggregate_attack = 0.01
aggregate_decay  = 0.25

# Auto-gain, used by every `_norm` field. The window is how far back the rolling
# maximum looks; the floor is essential and not a fudge -- without it a quiet
# passage drives the maximum toward zero and the next moment of near-silence is
# amplified into full-scale noise.
agc_window_seconds = 20.0
agc_floor          = 0.02

# Onset detection: adaptive spectral flux. The threshold is a moving mean scaled
# by `threshold_scale`. A FIXED threshold cannot work across a library holding
# both a quiet acoustic recording and a brickwalled master.
onset_window_seconds    = 1.0
onset_threshold_scale   = 1.6
onset_refractory_seconds = 0.05

# Tempo search range, BPM. Outside a musically plausible range the
# autocorrelation reliably locks onto half- and double-time and reports them
# confidently, which is worse than not answering.
tempo_min_bpm = 60.0
tempo_max_bpm = 200.0

# Below this confidence, `bpm` holds its last good value rather than jumping
# around. Prefer `beat_phase`, which free-runs and is always safe to read.
tempo_confidence_floor = 0.25


# ---------------------------------------------------------------------------
# [render] -- the window and the GL context
# ---------------------------------------------------------------------------
[render]

# Window size in pixels. LIVE. Today also: --width / --height
width  = 1280
height = 720

# Wait for vertical blank. Off uncaps the frame rate and tears; on is almost
# always what you want on a television. LIVE.
vsync = true

# Internal render scale. Below 1.0 renders smaller and upscales, which is the
# first thing to try if a heavy crystal cannot hold the refresh rate.
scale = 1.0

# Fill the display, ignoring width and height above. LIVE. Also --fullscreen,
# and --windowed to override this for one run.
#
# TAKES THE DISPLAY'S CURRENT MODE rather than setting one. The resolution and
# refresh rate belong to the graphics driver and to whatever the HDMI link
# negotiated -- a player that changed them would make that setting invisible and
# would invalidate `trim_ms`, which is a difference measured against display
# latency.
#
# Off by default because the desk is where every test run happens and a window
# that steals the display each time is hostile. The theatre asks for it.
fullscreen = false

# ---------------------------------------------------------------------------
# The final pass. THESE FOUR BELONG TO THE DISPLAY, not to any crystal, which is
# why they live here and not in a manifest -- a vignette or a safe-area inset
# changes the look of every crystal ever authored.
#
# All four were LIVE and read from this section long before they were written
# down here, which meant that following this file could not turn bloom on and
# there was no way to discover it existed. See issue 219.
# ---------------------------------------------------------------------------

# Bloom: how much of the over-threshold light is smeared back over the picture.
#
# THIS IS WHAT THE FLOAT LAYERS ARE FOR. Layers are GL_RGBA16F precisely so a
# crystal can exceed 1.0 before its vignette, and bloom is the pass that does
# something with the part above 1.0. At 0.0 that headroom is computed and thrown
# away. Measured at 70 microseconds at 4K on an RX 6800.
#
# 0.0 is off. Try 0.25 to see it at all; 0.6 is heavy.
bloom = 0.0

# What counts as "bright" for bloom, in the same units the layers work in. 1.0 is
# white. Lower catches more of the picture; above 1.0 catches only what a crystal
# deliberately pushed past white.
bloom_threshold = 1.0

# Film grain, as a fraction of an 8-bit step.
#
# ON BY DEFAULT BECAUSE IT IS A FIX, NOT A LOOK. The layers are float and the
# window is 8-bit, so a dark gradient bands. Measured: the same dark patch of
# `drift` goes from 208 to 288 distinct colours with grain at 1.0. Costs nothing
# when everything on this list is zero -- the compositor is then told it needs no
# canvas at all.
grain = 1.0

# Vignette: darken the corners. 0.0 is off.
#
# `pulse`, `drift` and `duel` each roll their own today, so this stacks with
# theirs rather than replacing it.
vignette = 0.0

# Safe-area mask, as a fraction inset from each edge. 0.0 is off; 0.02 is the
# classic television action-safe inset.
#
# A PROPERTY OF A PARTICULAR PROJECTOR'S GEOMETRY -- for when overscan or a lens
# loses the edge of the picture. Judge it on the projector, not on a monitor.
safe_area = 0.0

# Ask the driver for a debug context and log GL errors. Cheap, and it turns a
# silent misuse into a message at the moment it happens rather than a black
# screen twenty draw calls later. LIVE.
gl_debug = true

# Draw the debug facet -- every AudioFrame field as bars and markers -- instead
# of a crystal.
#
# THIS KEY EXISTS BECAUSE THE FACET WAS UNREACHABLE ON ANDROID. It already needed
# a flag once (issue 144): the only path to it was an empty vault and no crystal,
# and the config's vault defaults to "crystals", so on any normal setup the
# branch could not be entered. `--debug-facet` fixed that on the desk -- and an
# Activity launch passes no argv, so on a television the fix did not apply. Issue
# 242.
#
# `--debug-facet` still works and still wins. LIVE.
debug_facet = false

# Rebuild a crystal in place when its .frag or .toml is saved.
#
# ON BY DEFAULT IN EVERY MODE, because the authoring loop is what it exists for
# and a flag you have to remember is a flag you forget -- leaving you editing a
# file the player is ignoring. It also watches the vault directory, so a crystal
# copied in appears in about three seconds (issue 214), which on a device with no
# shell is the whole authoring story.
#
# `--no-watch` turns it off for one run. LIVE.
watch = true

# Draw through the layer stack rather than straight to the window.
#
# NOT A DEAD SWITCH. The direct path is taken automatically when a float
# framebuffer cannot be allocated, and a path nothing can reach on purpose is a
# path nobody finds out is broken. It is also the only way to measure what the
# compositor costs.
#
# Turning it off loses archives, crossfades, the final pass and every blend mode:
# those all live in the stack. Set it false to find out whether the compositor is
# what is wrong, not as a setting to keep.
#
# `--no-compositor` turns it off for one run. LIVE.
compositor = true


# ---------------------------------------------------------------------------
# [paths] -- only `vault` is read so far.
# ---------------------------------------------------------------------------
[paths]

# The crystal vault: the directory holding `.frag` + `.toml` crystal pairs.
#
# LIVE. Today also: --vault. An explicit --crystal outranks it, so naming one
# crystal on the command line does not silently get overruled by this.
#
# The calibration instrument deliberately does NOT live here -- instruments/ is
# separate, so paging through the vault never lands on a strobing white screen.
vault = "crystals"

# Which crystal in the vault to open on, by manifest name.
#
# EMPTY MEANS THE FIRST, which is alphabetical and therefore arbitrary: the vault
# is ordered by name so Windows and Linux agree on the order, not because the
# first one is the one worth looking at. The left and right arrows still move
# between them while it runs; this only chooses where a run begins.
#
# Naming one that is not there is reported rather than silently ignored --
# otherwise you edit a crystal the player is not drawing.
#
# LIVE.
crystal = ""

# MilkDrop presets USED TO BE SPELLED `preset_packs` HERE, before M4 existed to
# read them. They now have their own section -- see [projectm] below -- because
# the path is only one of ten things that describe how projectM runs, and one
# key sitting among the crystal paths implied it was the same kind of thing.
# A `preset_packs` key here is now simply ignored.

# Album art, palettes and Plex metadata (M5).
cache = "cache"

# Empty logs to stderr only.
log = ""


# ---------------------------------------------------------------------------
# [projectm] -- M4. MilkDrop presets, through libprojectM. ALL LIVE.
# ---------------------------------------------------------------------------
#
# TWO THINGS HERE POINT AT SOFTWARE HOLOCRON DOES NOT SHIP, and that is by
# design rather than by omission.
#
# libprojectM is LGPL and is reached by opening it at RUNTIME through its C API
# -- there is no vcpkg dependency, no import entry in the executable, and no
# projectM header anywhere in the source tree. A machine without it runs
# Holocron with one fewer thing in the vault. See THIRD-PARTY-NOTICES.md.
#
# THE PRESETS ARE SOMEBODY ELSE'S WORK AND CANNOT SHIP EITHER. A pack is tens of
# thousands of `.milk` files by hundreds of authors, almost none carrying a
# licence statement -- which means all rights reserved, not public domain.
# Nothing stops you running a pack you obtained yourself; that is the intended
# and only workflow. See the wiki's Preset-Packs page.
#
# There is deliberately NO `enabled` key. What turns projectM on is having
# somewhere to read presets from. A key saying yes beside an empty path is a
# setting that cannot work and an error message waiting to be written.
[projectm]

# A directory of `.milk` files, SCANNED RECURSIVELY. Empty means projectM is not
# offered at all, which is the default.
#
# Recursive because real packs are nested several directories deep, so a
# non-recursive scan of the top of one finds nothing and looks exactly like a
# wrong path. Point it OUTSIDE this repository -- `.gitignore` blocks `.milk`
# and the obvious directory names precisely so a careless `git add -A` cannot
# sweep somebody else's work into a public repo.
#
# LIVE. Today also: --projectm DIR, which additionally opens the run on it.
preset_path = ""

# Where `projectM-4` and its playlist module live.
#
# EMPTY LETS THE OS LOADER SEARCH, which is what a system-installed libprojectM
# wants and is the right answer on Linux. Set it to a directory when you have
# unpacked a build somewhere of your own.
#
# A DIRECTORY, NOT A FILE. The two modules always ship together and, on Windows,
# so does the GLEW that projectM-4.dll imports -- naming one file would leave
# the other two to luck. All three have to be in the same directory, and the
# error when they are not is Windows error 126 naming the file that is present.
#
# LIVE. Today also: --projectm-lib DIR.
library_dir = ""

# Where presets look for the images some of them sample. Optional: a preset
# asking for a texture that is not there falls back to a built-in.
#
# LIVE.
texture_path = ""

# How long a preset stays up, and how long the blend between two takes.
#
# THIS IS NOT `[render] advance`. These are projectM's OWN transitions between
# presets; `advance` moves between VAULT ENTRIES, which is a different and
# larger change. A projectM entry that sat on one preset for three minutes
# because advance_seconds said so would be a MilkDrop visualizer with the
# interesting part switched off.
#
# LIVE.
preset_duration   = 30.0
soft_cut_duration = 3.0

# A hard cut is an instant change on a loud transient rather than a timed blend,
# and `hard_cut_duration` is the shortest time it will let pass between two.
#
# OFF BY DEFAULT because it fires on the music rather than on the clock, and
# whether that reads as responsive or as flickering is a judgement to make on
# your own projector rather than one to impose from a default.
#
# LIVE.
hard_cut          = false
hard_cut_duration = 60.0

# How readily projectM's own beat detector fires. Higher is more sensitive.
#
# projectM does its OWN analysis of the PCM it is fed and does not read
# AudioFrame -- a MilkDrop preset has no idea this project has a beat grid. So
# this knob is unrelated to `[audio] trim_ms` and to anything under [analysis].
#
# LIVE.
beat_sensitivity = 1.0

# Playlist order.
#
# ON BY DEFAULT, because a pack is thousands of files in whatever order the
# filesystem gave them, and alphabetical order through one means a whole evening
# in the a's. Togglable from the control page while it runs.
#
# LIVE.
shuffle = true

# The per-preset warp and composite grid. projectM's own default is 48x32.
# Larger is smoother and costs real time on a 4K layer.
#
# LIVE.
mesh_x = 48
mesh_y = 32


# ---------------------------------------------------------------------------
# [plex] -- M5. Discovery is live; the server and token are not read yet.
# ---------------------------------------------------------------------------
#
# THIS SECTION IS WHY gatekeeper.toml IS GITIGNORED. A Plex token grants access
# to the whole library; once it lands in a public repo that anyone has forked,
# rewriting history does not retract it.
[plex]

# Announce on the LAN so Holocron appears in Plexamp's device list.
#
# Turning this off is a real answer, not a debugging aid: the player still works
# from the command line, and on a network you do not control you may simply not
# want it advertising itself.
#
# LIVE. Today also: --discover to test it on its own, --no-discover for one run.
discovery = true

# What appears in Plexamp's device list. LIVE.
device_name = "Holocron"

# Identifies this player to Plex clients, and must be STABLE across restarts --
# with a new one each run, Plexamp's device list gains a new entry every time
# Holocron starts and none of the old ones ever go away.
#
# Leave it empty and Holocron generates one on first run, then prints the line
# to paste back here. That is the intended way to fill it in; there is nothing
# to look up.
#
# This one is NOT a secret. It is broadcast over the LAN in the clear by design,
# and is the only key in this section that is safe in a screenshot. The token
# below is not, which is why this file is gitignored.
#
# LIVE.
machine_identifier = ""

# The port the Companion HTTP endpoints listen on. It is announced over GDM, so
# clients use whatever is advertised rather than assuming a number -- move it
# freely if something else on this machine holds 32500.
#
# YOU DO NOT HAVE TO. If this port cannot be had, Holocron takes a free one
# instead and announces that, rather than starting without a control page --
# which on a device with no keyboard would leave nothing to drive it with at all.
# It says so on the terminal when it happens, along with why the port it wanted
# was refused. Set this key only to PIN a particular port, for a firewall rule or
# a port forward.
#
# Zero means "any free port", and is what the tests use.
#
# LIVE.
port = 32500

# What Holocron claims it can be asked to do.
#
# EMPTY MEANS THE BUILT-IN DEFAULT, which is `timeline,playback,navigation,
# playqueues` -- exactly what plex-mpv-shim announces. Leave it empty unless you
# are deliberately testing a variation.
#
# It is settable at all because this protocol has no specification and the only
# test that means anything is a real phone. Whether a client offers this device
# can turn on this one string, and finding that out one rebuild at a time is not
# a workable loop.
#
# LIVE.
capabilities = ""

# How the device presents itself: "pc", "stb", "mobile", or "tv".
#
# EMPTY MEANS THE BUILT-IN DEFAULT, which is "pc". Clients group and filter
# their device lists by this, and which values a given client will offer is not
# written down anywhere -- so it is settable for the same reason `capabilities`
# is.
#
# It also stops being a guess on the Shield at M8, where the right answer is
# "stb" and this becomes a config change rather than a code change.
#
# LIVE.
device_class = ""

# The example address is from RFC 5737's documentation range on purpose, so that
# pasting this template unedited cannot probe a real machine.
server = "http://192.0.2.1:32400"

# Leave EMPTY here. Put the real token in gatekeeper.toml, which is gitignored.
# Holocron refuses to start if it finds this placeholder value in a real config,
# rather than failing later with a confusing authentication error.
token = ""


# ---------------------------------------------------------------------------
# [herald] -- errands for the room, when playback starts and stops
#
# WHY THIS EXISTS. Bit-perfect LPCM does not carry the flags a compressed
# bitstream does, so a receiver fed PCM does not auto-select a listening mode --
# it stays in whatever it was last left in. The rack wants Direct, and nobody
# wants to walk to the amplifier.
#
# AN ERRAND IS A URI, and that is the whole extensibility mechanism. Two schemes
# run today:
#
#   eiscp://<address>[:port]/<COMMAND>   an Onkyo/Integra command over TCP 60128
#   wait://<milliseconds>               pause before the next errand
#
# ADDRESSES ARE DOTTED QUADS, NOT NAMES. Resolving a name has no portable
# timeout, and these run where a stall would be felt. Give the receiver a static
# lease on the router.
#
# LIVE, and both lists default to empty -- which is the off switch. There is no
# `enabled` key, because a second key that can disagree with the list is a way to
# be confused rather than a feature. `--no-herald` overrides the file for one run.
# ---------------------------------------------------------------------------
[herald]

# What to send when playback starts.
#
# THE WAIT IS NOT A NICETY. A receiver waking from standby re-initialises its
# network stack, so anything sent too soon after the power-on is simply dropped
# on the floor -- and each errand opens its own connection precisely because the
# one that carried PWR01 does not survive the wake. Four seconds is a starting
# point; a cold unit can want longer, and the right number belongs to the rack.
#
#   on_start = [
#       "eiscp://192.0.2.50/PWR01",   # power on
#       "wait://4000",                # let it wake up
#       "eiscp://192.0.2.50/SLI05",   # select the PC input -- see the table below
#       "eiscp://192.0.2.50/LMD01",   # listening mode DIRECT
#   ]
#
# LMD01 IS DIRECT. LMD11 IS PURE AUDIO, which on several Onkyo models shuts the
# video circuitry down along with the front display -- with a projector on the
# HDMI output that is a black screen and a confused evening. Do not "upgrade" it.
#
# Input codes (SLI): 00 VCR/DVR, 01 CBL/SAT, 02 GAME, 03 AUX, 05 PC, 10 BD/DVD,
# 11 STRM BOX, 12 TV, 22 PHONO, 23 TV/CD, 24 FM, 2B NET, 80 SOURCE.
#
# LEAVE THE LISTENING MODE OUT IF SOMETHING ELSE ON YOUR RACK OWNS IT.
#
# A receiver stores a listening mode PER INPUT, so it is a piece of shared state
# and two programs writing it is not "the last one wins" -- it is a preference
# being overwritten for whatever somebody is actually listening to. If you run a
# dedicated listening-mode manager, give it the mode and keep only PWR and SLI
# here. Holocron is the only one of the two that knows "I am about to make sound
# on this input" early enough to wake an amplifier and select it; a mode manager
# is the only one that knows the library, the codec and the title. See D-060.
#
# That split is live on this project's own rack: the PC input keeps LMD01 below
# because nothing else claims it, and the Shield's config sends PWR and SLI only.
on_start = []

# What to send when playback stops.
#
# EMPTY IS A REAL ANSWER, not an unfinished one. Powering the receiver off
# underneath somebody who paused to answer the door is helpfulness nobody thanks
# you for, and leaving it on costs a few watts. `["eiscp://192.0.2.50/PWR00"]` is
# one line away for anyone who disagrees.
#
# A stop only fires after playback has been over for a couple of seconds, so a
# track change -- which stops and restarts the session -- never triggers one.
on_stop = []

# How long to wait for the receiver to answer, in milliseconds.
#
# A receiver that is off does not REFUSE a connection, it ignores it, and the
# operating system's own patience is around 21 seconds. This is the number that
# bounds how long a shutdown can take.
connect_timeout_ms = 1500

# After a failed errand, do not try again for this long, in seconds.
#
# Without it, an absent receiver costs a full timeout at every start and stop for
# the life of the process. With it, it costs one a minute and one log line.
cooldown_seconds = 60

# ---------------------------------------------------------------------------
# The phone's volume slider (issue 126)
#
# Reaching for the volume on the phone during a cast used to do nothing, and that
# was correct: applying it in software means scaling samples, which would end the
# bit-perfect output WASAPI exclusive mode exists for.
#
# Sending it to the RECEIVER is the answer that keeps both. It attenuates in its
# own domain, downstream of everything Holocron touches, so the slider works AND
# the signal stays exact -- it is the same control the remote already drives.
#
# A TEMPLATE, NOT A URI, and it is the only one in this file. Every other errand
# is complete the moment it is read; a volume command carries a number that only
# exists when the slider moves. Exactly one placeholder, and three spellings:
#
#   {}       the level in decimal      -- what a webhook wants
#   {:02X}   two hex digits, uppercase -- what eISCP's MVL wants
#   {:02x}   two hex digits, lowercase
#
#   on_volume = "eiscp://192.0.2.50/MVL{:02X}"
#   on_volume = "http://192.0.2.60:8123/api/webhook/vol?level={}"
#
# Empty is the off switch, like the two lists above.
on_volume = ""

# The loudest this is ever allowed to ask for, in the RECEIVER'S OWN UNITS.
#
# REQUIRED whenever `on_volume` is set, and it has NO DEFAULT ON PURPOSE. Plex's
# slider is 0..100 and MVL is hex, so a pass-through sends MVL64 at the top --
# which on a theater amplifier is full output, into a room, possibly at night,
# from a phone in somebody's pocket. No ceiling is safe on every rack, and the
# obvious guess is the amplifier's own maximum, which is the worst one available.
# So it is demanded instead: set `on_volume` without this and the player says so
# and forwards nothing.
#
# READ IT OFF THE UNIT rather than a published table. The maximum is a property
# of the receiver and often of its own setup menu -- the same lesson the input
# codes taught, where `05` is PC and `11` is STRM BOX on this one and no table
# would have said so. Start low and raise it.
#
#   volume_max = 40
volume_max = -1

# REPLACING eISCP ENTIRELY is an edit to a value, not a change of shape -- which
# is the point of errands being URIs. A Home Assistant webhook would read:
#
#   on_start = ["http://192.0.2.60:8123/api/webhook/holocron_start"]
#
# `http` is NOT implemented yet and is refused by name, with a message saying the
# shape is right and the encoder is what is missing. The seam is what M7 asked
# for; the second backend is a day's work when somebody wants it.
